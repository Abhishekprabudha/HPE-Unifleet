name: Build narrated Global Airlines video

on:
  workflow_dispatch:
  push:
    paths:
      - 'Global Airlines.mp4'
      - unifleet-narration.html
      - scripts/generate_narrated_video.py
      - .github/workflows/narrated-video.yml

jobs:
  narrated-video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install narration and video tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create narrated MP4
        run: python scripts/generate_narrated_video.py

      - name: Upload downloadable narrated video
        uses: actions/upload-artifact@v4
        with:
          name: global-airlines-with-narration
          path: video/global-airlines-with-narration.mp4
          if-no-files-found: error
          retention-days: 30
