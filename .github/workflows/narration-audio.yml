name: Build narration audio

on:
  workflow_dispatch:
  push:
    paths:
      - unifleet-narration.html
      - scripts/generate_narration.py
      - .github/workflows/narration-audio.yml

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narration tooling
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate MP3
        run: python scripts/generate_narration.py
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: unifleet-narration-mp3
          path: audio/unifleet-complete-narration.mp3
